<div class="builder-head"><div><div class="eyebrow">SPECTRE EMBED STUDIO</div><div class="tab-title">منشئ رسائل Embed 🖼️</div><div class="tab-desc">أرسل رسالة Embed مستقلة بسرعة، مع صور، Thumbnail، Author، Footer وحقول منظمة.</div></div><div class="builder-badge">جاهز للنشر</div></div>
<div class="builder-layout">
<section><div class="card builder-card"><div class="card-title-row"><div><h3>✍️ الرسالة</h3><small>كل شيء يظهر في Discord كما تكتبه هنا</small></div></div>
<div class="field"><label>القناة</label><select id="eb-channel">{% for channel in guild['channels'] %}<option value="{{ channel['id'] }}">#{{ channel['name'] }}</option>{% endfor %}</select></div>
<div class="row"><div class="field"><label>العنوان</label><input id="eb-title" value="رسالة Spectre"></div><div class="field"><label>اللون</label><div class="color-row"><input id="eb-color" type="color" value="#5865F2"><input id="eb-color-text" value="#5865F2"></div></div></div>
<div class="field"><label>الوصف</label><textarea id="eb-desc" placeholder="اكتب نص الرسالة..."></textarea></div>
<div class="row"><div class="field"><label>الصورة الكبيرة</label><input id="eb-image" placeholder="https://..."></div><div class="field"><label>Thumbnail</label><input id="eb-thumb" placeholder="https://..."></div></div>
<div class="row"><div class="field"><label>Author</label><input id="eb-author" placeholder="Spectre"></div><div class="field"><label>Footer</label><input id="eb-footer" placeholder="Spectre • 2026"></div></div>
</div>
<div class="card builder-card"><div class="card-title-row"><div><h3>🧱 الحقول</h3><small>أضف تفاصيل منظمة للرسالة</small></div><button class="btn btn-ghost btn-sm" onclick="addEField()">＋ حقل</button></div><div id="eb-fields"></div></div>
<button class="btn btn-gold publish-big" onclick="sendEmbedBuilder()">📨 إرسال Embed الآن</button></section>
<aside class="preview-wrap"><div class="preview-sticky"><div class="preview-label"><span>LIVE PREVIEW</span><small>معاينة</small></div><div class="discord-preview"><div class="discord-preview-user"><div class="preview-avatar">S</div><div><b>Spectre</b><small>الآن</small></div></div><div class="embed-preview" id="eb-preview"><div id="eb-p-author" class="preview-author"></div><div id="eb-p-title" class="preview-title">رسالة Spectre</div><div id="eb-p-desc" class="preview-desc">وصف الرسالة سيظهر هنا.</div><div id="eb-p-fields" class="preview-fields"></div><img id="eb-p-image" class="preview-image" style="display:none"><div id="eb-p-footer" class="preview-footer"></div></div></div></div></aside></div>
<script>
let ef=0;function addEField(){ef++;const e=document.createElement('div');e.className='builder-item field-item';e.innerHTML=`<div class="builder-item-top"><b>حقل #${ef}</b><button class="icon-delete" onclick="this.parentElement.parentElement.remove();previewEB()">×</button></div><div class="row"><div class="field"><label>الاسم</label><input data-e="name" value="معلومة"></div><div class="field"><label>القيمة</label><input data-e="value" value="اكتب هنا"></div></div>`;document.getElementById('eb-fields').appendChild(e);previewEB()}
function previewEB(){document.getElementById('eb-p-title').textContent=document.getElementById('eb-title').value||'بدون عنوان';document.getElementById('eb-p-desc').textContent=document.getElementById('eb-desc').value||'بدون وصف';document.getElementById('eb-p-author').textContent=document.getElementById('eb-author').value;document.getElementById('eb-p-footer').textContent=document.getElementById('eb-footer').value;const im=document.getElementById('eb-p-image');im.src=document.getElementById('eb-image').value;im.style.display=document.getElementById('eb-image').value?'block':'none';document.getElementById('eb-preview').style.borderRightColor=document.getElementById('eb-color-text').value;document.getElementById('eb-p-fields').innerHTML=[...document.querySelectorAll('#eb-fields .field-item')].map(e=>`<div><b>${e.querySelector('[data-e=name]').value}</b><span>${e.querySelector('[data-e=value]').value}</span></div>`).join('')}
async function sendEmbedBuilder(){const fields=[...document.querySelectorAll('#eb-fields .field-item')].map(e=>({name:e.querySelector('[data-e=name]').value,value:e.querySelector('[data-e=value]').value,inline:false}));await callAction('embed',{channel_id:document.getElementById('eb-channel').value,title:document.getElementById('eb-title').value,description:document.getElementById('eb-desc').value,color:document.getElementById('eb-color-text').value,image_url:document.getElementById('eb-image').value,thumbnail_url:document.getElementById('eb-thumb').value,author:{name:document.getElementById('eb-author').value},footer:{text:document.getElementById('eb-footer').value},fields});}
['eb-title','eb-desc','eb-image','eb-author','eb-footer','eb-color-text'].forEach(id=>document.getElementById(id).addEventListener('input',previewEB));document.getElementById('eb-color').addEventListener('input',e=>{document.getElementById('eb-color-text').value=e.target.value;previewEB()});addEField();previewEB();
</script>
