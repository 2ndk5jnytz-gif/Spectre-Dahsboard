<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ guild['name'] }} — Spectre</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="guild-name">
                {% if guild['icon'] %}<img src="{{ guild['icon'] }}" alt="">{% endif %}
                <span>{{ guild['name'] }}</span>
            </div>
            {% for label, slug in tabs %}
            <a class="nav-item {% if slug == active_tab %}active{% endif %}" href="{{ url_for('guild_dashboard', guild_id=guild_id, tab=slug) }}">{{ label }}</a>
            {% endfor %}
            <a class="back-link" href="{{ url_for('guild_picker') }}">⇦ رجوع للسيرفرات</a>
        </nav>
        <main class="content">
            {% include template %}
        </main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
