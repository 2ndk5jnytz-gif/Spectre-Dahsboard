
<div class="tab-title">⚡ الأتمتة والردود</div>
<div class="tab-desc">ردود تلقائية، حضور متغير، وإدارة سريعة للأتمتة.</div>

<div class="card">
<h3>🤖 الردود التلقائية</h3>
<div class="row">
<div class="field"><label>العبارة</label><input id="ar-trigger" type="text"></div>
<div class="field"><label>نوع التطابق</label><select id="ar-type"><option value="exact">مطابقة تامة</option><option value="contains">تحتوي على العبارة</option></select></div>
</div>
<div class="field"><label>الرد</label><textarea id="ar-response"></textarea></div>
<button class="btn btn-gold" onclick="addAR()">＋ إضافة</button>
<table><thead><tr><th>العبارة</th><th>النوع</th><th>الرد</th><th></th></tr></thead><tbody>
{% for item in auto_responses %}<tr><td>{{item['trigger_text']}}</td><td>{{item['match_type']}}</td><td>{{item['response_text'][:100]}}</td><td><button class="btn btn-danger" onclick="delAR({{item['id']}})">حذف</button></td></tr>{% else %}<tr><td colspan="4" class="muted">لا توجد ردود.</td></tr>{% endfor %}
</tbody></table>
</div>

<div class="card">
<h3>🎭 Presence المتغير</h3>
<div class="field"><label>العبارات (كل عبارة في سطر)</label><textarea id="presence-messages">{% for m in presence['messages'] %}{{m}}
{% endfor %}</textarea></div>
<div class="field"><label>الفاصل بالثواني</label><input id="presence-interval" type="number" min="15" value="{{presence['interval_seconds']}}"></div>
<button class="btn btn-gold" onclick="savePresence()">💾 حفظ وتطبيق</button>
</div>

<script>
async function addAR(){const r=await fetch(`/dashboard/${GUILD_ID}/auto-responses`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({trigger:document.getElementById("ar-trigger").value,response:document.getElementById("ar-response").value,match_type:document.getElementById("ar-type").value})});const x=await r.json();showToast(x.ok?"✅ تم":"❌ "+x.error,x.ok);if(x.ok)location.reload();}
async function delAR(id){const r=await fetch(`/dashboard/${GUILD_ID}/auto-responses/${id}`,{method:"DELETE"});const x=await r.json();showToast(x.ok?"🗑️ تم":"❌ فشل",x.ok);if(x.ok)location.reload();}
async function savePresence(){const messages=document.getElementById("presence-messages").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const r=await fetch(`/dashboard/${GUILD_ID}/presence`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,interval_seconds:document.getElementById("presence-interval").value})});const x=await r.json();showToast(x.ok?"✅ تم تطبيق Presence":"❌ "+(x.error||"فشل"),x.ok);}
</script>
