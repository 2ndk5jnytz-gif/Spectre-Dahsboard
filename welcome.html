<div class="tab-title">👋 الترحيب</div>
<div class="tab-desc">رسالة الترحيب بالأعضاء الجدد.</div>

<div class="card">
    <div class="row">
        <div class="field">
            <label>الحالة</label>
            <select data-key="welcome_enabled">
                <option value="1" {% if settings['welcome_enabled'] %}selected{% endif %}>مفعّل</option>
                <option value="0" {% if not settings['welcome_enabled'] %}selected{% endif %}>معطّل</option>
            </select>
        </div>
        <div class="field">
            <label>قناة الترحيب</label>
            <select data-key="welcome_channel_id">
                {% for channel in guild['channels'] %}
                <option value="{{ channel['id'] }}" {% if settings['welcome_channel_id']|string == channel['id'] %}selected{% endif %}>#{{ channel['name'] }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <button class="btn btn-gold" onclick="saveSettings(collectForm(document.querySelector('.card')))">💾 حفظ</button>
</div>
