<div class="tab-title">🛡️ التقديم للإدارة</div>
<div class="tab-desc">اضبط زر التقديم وانشره — يدعم رفع صورة من رابط للـ Embed.</div>

<div class="card">
    <h3>قناة مراجعة الطلبات</h3>
    <div class="field">
        <label>القناة التي تصل إليها التقديمات الجديدة</label>
        <select id="review-channel">
            {% for channel in guild['channels'] %}
            <option value="{{ channel['id'] }}" {% if settings['review_channel_id']|string == channel['id'] %}selected{% endif %}>#{{ channel['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <button class="btn btn-gold" onclick="saveReviewChannel()">💾 حفظ</button>
</div>

<div class="card">
    <h3>نشر زر التقديم</h3>
    <div class="row">
        <div class="field">
            <label>الإيموجي</label>
            <select id="apply-emoji">
                <option value="🛠️">🛠️ (افتراضي)</option>
                {% for emoji in guild['emojis'] %}
                <option value="{{ '<a:' if emoji['animated'] else '<:' }}{{ emoji['name'] }}:{{ emoji['id'] }}>">{{ emoji['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>لون الزر</label>
            <select id="apply-style">
                <option value="blurple">بنفسجي</option>
                <option value="success">أخضر</option>
                <option value="danger">أحمر</option>
                <option value="grey">رمادي</option>
            </select>
        </div>
    </div>
    <div class="field">
        <label>عنوان الرسالة</label>
        <input type="text" id="apply-title" value="التقديم للإدارة 🛡️">
    </div>
    <div class="field">
        <label>الوصف</label>
        <textarea id="apply-desc">هذه الغرفة مخصصة لطلبات الإدارة. اضغط الزر في الأسفل ثم املأ النموذج.</textarea>
    </div>
    <div class="row">
      <div class="field"><label>الصورة الكبيرة</label><input type="text" id="apply-image" placeholder="رابط الصورة أو ارفع من الهاتف"><div class="upload-row"><input id="apply-image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden onchange="uploadDashboardImage(this,document.getElementById('apply-image'),this.nextElementSibling)"><button type="button" class="btn btn-ghost" onclick="document.getElementById('apply-image-file').click()">📱 رفع من الهاتف</button></div></div>
      <div class="field"><label>الصورة المصغرة</label><input type="text" id="apply-thumb" placeholder="رابط الصورة أو ارفع من الهاتف"><div class="upload-row"><input id="apply-thumb-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden onchange="uploadDashboardImage(this,document.getElementById('apply-thumb'),this.nextElementSibling)"><button type="button" class="btn btn-ghost" onclick="document.getElementById('apply-thumb-file').click()">📱 رفع من الهاتف</button></div></div>
      <div class="field"><label>لون الـ Embed</label><input type="text" id="apply-color" value="#5865F2"></div>
    </div>
    <div class="field">
        <label>القناة</label>
        <select id="apply-channel">
            {% for channel in guild['channels'] %}
            <option value="{{ channel['id'] }}">#{{ channel['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <button class="btn btn-gold" onclick="publishApplyPanel()">🚀 نشر الآن على ديسكورد</button>
</div>

<script>
function saveReviewChannel() {
    saveSettings({ review_channel_id: document.getElementById("review-channel").value });
}
async function publishApplyPanel() {
    await callAction("apply-panel", {
        channel_id: document.getElementById("apply-channel").value,
        emoji: document.getElementById("apply-emoji").value,
        style: document.getElementById("apply-style").value,
        title: document.getElementById("apply-title").value,
        description: document.getElementById("apply-desc").value,
        image_url: document.getElementById("apply-image").value,
        thumbnail_url: document.getElementById("apply-thumb").value,
        color: document.getElementById("apply-color").value,
    });
}
</script>
